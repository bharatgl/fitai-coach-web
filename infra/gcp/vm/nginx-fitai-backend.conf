limit_req_zone $binary_remote_addr zone=fitai_api_per_ip:10m rate=60r/m;

map $http_upgrade $fitai_connection_upgrade {
    default upgrade;
    '' close;
}

upstream fitai_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream fitai_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name forgefit.space www.forgefit.space _;

    server_tokens off;
    client_max_body_size 1m;

    location = /health/backend/live {
        proxy_pass http://fitai_backend/health/live;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/backend/ready {
        proxy_pass http://fitai_backend/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://fitai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fitai_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.forgefit.space;

    server_tokens off;
    client_max_body_size 1m;

    location /health/ {
        proxy_pass http://fitai_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=fitai_api_per_ip burst=30 nodelay;

        proxy_pass http://fitai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }
}
