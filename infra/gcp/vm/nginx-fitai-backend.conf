limit_req_zone $binary_remote_addr zone=fitai_api_per_ip:10m rate=60r/m;

upstream fitai_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    location = / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"service":"fitai-backend","status":"ok","health":"/health/live"}';
    }

    location /health/live {
        proxy_pass http://fitai_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=fitai_api_per_ip burst=30 nodelay;

        proxy_pass http://fitai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }
}
