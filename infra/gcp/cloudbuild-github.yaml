steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        printf '%s\n' "${_SOURCE_REVISION}" | grep -Ex '[0-9a-f]{40}'
        git init .
        git remote add origin https://github.com/bharatgl/fitai-coach-web.git
        git fetch --depth=1 origin "${_SOURCE_REVISION}"
        git checkout --detach FETCH_HEAD
        git rev-parse HEAD | grep -Fx "${_SOURCE_REVISION}"

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-backend:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-frontend:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-backend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-frontend:${_IMAGE_TAG}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: fitai
  _IMAGE_TAG: latest
  _SOURCE_REVISION: "0000000000000000000000000000000000000000"

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
