steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-backend:${_IMAGE_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-frontend:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-backend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/fitai-frontend:${_IMAGE_TAG}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: fitai
  _IMAGE_TAG: latest

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
