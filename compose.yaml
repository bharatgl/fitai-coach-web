services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "4000:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - frontend/.env.local
    environment:
      AUTH_TRUST_HOST: "true"
      BACKEND_API_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 8080
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
